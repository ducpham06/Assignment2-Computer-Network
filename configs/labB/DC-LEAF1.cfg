! ========================================================================
! TVI Innovations -- DC-LEAF1 (Arista vEOS, leaf) -- HQ data-centre EVPN-VXLAN fabric
! Generated by tools/build_configs.py. After pasting: 'write' then 'reload' once
! (the multi-agent routing model is required for EVPN).
! ========================================================================
hostname DC-LEAF1
service routing protocols model multi-agent
!
username tviadmin privilege 15 role network-admin secret Tvi@Lab2026
ip domain-name tvi.lab
clock timezone Asia/Ho_Chi_Minh
!
management ssh
   idle-timeout 15
!
interface Management1
   ip address 172.16.99.43/24
!
vlan 110
   name DC_APP
vlan 120
   name DC_DB
!
vrf instance TENANT-PROD
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
ip routing vrf TENANT-PROD
!
interface Ethernet1
   description Fabric -> DC-SPINE1 Ethernet1
   no switchport
   mtu 9214
   ip address 10.10.190.1/31
   ip ospf network point-to-point
!
interface Ethernet2
   description Fabric -> DC-SPINE2 Ethernet1
   no switchport
   mtu 9214
   ip address 10.10.190.5/31
   ip ospf network point-to-point
!
interface Loopback0
   description Router-ID / BGP EVPN peering
   ip address 10.10.191.11/32
!
interface Loopback1
   description VXLAN VTEP source
   ip address 10.10.191.21/32
!
interface Ethernet3
   description Host DC-H1 (10.10.128.11)
   switchport access vlan 110
   spanning-tree portfast
!
interface Vlan110
   description Anycast gateway DC_APP
   vrf TENANT-PROD
   ip address virtual 10.10.128.1/24
!
interface Vlan120
   description Anycast gateway DC_DB
   vrf TENANT-PROD
   ip address virtual 10.10.129.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 110 vni 10110
   vxlan vlan 120 vni 10120
   vxlan vrf TENANT-PROD vni 50001
!
interface Ethernet5
   description DC border -> HCM-CORE1 Gi1/2 (campus OSPF 10)
   no switchport
   vrf TENANT-PROD
   ip address 10.10.189.2/30
   ip ospf network point-to-point
!
router ospf 1
   router-id 10.10.191.11
   passive-interface Loopback0
   passive-interface Loopback1
   network 10.10.190.0/24 area 0.0.0.0
   network 10.10.191.0/24 area 0.0.0.0
   max-lsa 12000
!
router ospf 11 vrf TENANT-PROD
   router-id 10.10.191.11
   network 10.10.189.0/30 area 0.0.0.0
   redistribute connected
   max-lsa 12000
!
router bgp 65011
   router-id 10.10.191.11
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor SPINES peer group
   neighbor SPINES remote-as 65011
   neighbor SPINES update-source Loopback0
   neighbor SPINES send-community extended
   neighbor 10.10.191.1 peer group SPINES
   neighbor 10.10.191.2 peer group SPINES
   !
   vlan 110
      rd 10.10.191.11:10110
      route-target both 110:10110
      redistribute learned
   !
   vlan 120
      rd 10.10.191.11:10120
      route-target both 120:10120
      redistribute learned
   !
   address-family evpn
      neighbor SPINES activate
   !
   vrf TENANT-PROD
      rd 10.10.191.11:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      redistribute connected
!
end
