! ========================================================================
! TVI Innovations -- DC-SPINE1 (Arista vEOS, spine) -- Lab B EVPN-VXLAN fabric
! Generated by tools/build_configs.py. After pasting: 'write' then 'reload' once
! (the multi-agent routing model is required for EVPN).
! ========================================================================
hostname DC-SPINE1
service routing protocols model multi-agent
!
username tviadmin privilege 15 role network-admin secret Tvi@Lab2026
ip domain-name tvi.lab
clock timezone Asia/Ho_Chi_Minh
!
management ssh
   idle-timeout 15
!
interface Management1
   ip address 172.16.99.41/24
!
ip routing
!
interface Ethernet1
   description Fabric -> DC-LEAF1 Ethernet1
   no switchport
   mtu 9214
   ip address 10.10.190.0/31
   ip ospf network point-to-point
!
interface Ethernet2
   description Fabric -> DC-LEAF2 Ethernet1
   no switchport
   mtu 9214
   ip address 10.10.190.2/31
   ip ospf network point-to-point
!
interface Loopback0
   description Router-ID / BGP EVPN peering
   ip address 10.10.191.1/32
!
router ospf 1
   router-id 10.10.191.1
   passive-interface Loopback0
   network 10.10.190.0/24 area 0.0.0.0
   network 10.10.191.0/24 area 0.0.0.0
   max-lsa 12000
!
router bgp 65011
   router-id 10.10.191.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor LEAVES peer group
   neighbor LEAVES remote-as 65011
   neighbor LEAVES update-source Loopback0
   neighbor LEAVES route-reflector-client
   neighbor LEAVES send-community extended
   neighbor 10.10.191.11 peer group LEAVES
   neighbor 10.10.191.12 peer group LEAVES
   !
   address-family evpn
      neighbor LEAVES activate
!
end
